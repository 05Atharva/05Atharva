<svg xmlns="http://www.w3.org/2000/svg" width="660" height="155" viewBox="0 0 660 155" role="img" aria-labelledby="title description">
  <title id="title">ShopSync Edge signal flow</title>
  <desc id="description">A Go collector polls Modbus registers and sends events to an MQTT broker. A Go backend reads the events and updates Shopify and a live React dashboard.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#252017"/>
      <stop offset="1" stop-color="#161613"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#ebad63" opacity=".19"/>
    </pattern>
    <marker id="arrow" markerWidth="5" markerHeight="6" refX="4.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m.5.5 4 2.5-4 2.5" fill="none" stroke="#99c6f4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="659" height="154" rx="12" fill="url(#panel)" stroke="#66513a"/>
  <rect x="12" y="44" width="636" height="97" fill="url(#grid)"/>
  <path d="M20 42h620" stroke="#524131"/>
  <path d="M21 23h6l3-5 5 10 3-5h7" fill="none" stroke="#ebad63" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="55" y="29" fill="#ebad63" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1.2">SHOPSYNC EDGE</text>
  <text x="639" y="29" fill="#bbbaae" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="1">SIGNAL FLOW</text>

  <g fill="#211e18" stroke="#735536">
    <rect x="20" y="73" width="103" height="44" rx="6"/>
    <rect x="146" y="73" width="103" height="44" rx="6"/>
    <rect x="272" y="73" width="103" height="44" rx="6"/>
    <rect x="398" y="73" width="103" height="44" rx="6"/>
  </g>
  <g fill="#192321" stroke="#507482">
    <rect x="534" y="54" width="106" height="34" rx="6"/>
    <rect x="534" y="103" width="106" height="34" rx="6"/>
  </g>
  <g fill="none" stroke="#99c6f4" stroke-width="1.3" marker-end="url(#arrow)">
    <path d="M123 95h20"/>
    <path d="M249 95h20"/>
    <path d="M375 95h20"/>
    <path d="M501 95h14v-24h16"/>
    <path d="M515 95v25h16"/>
  </g>
  <circle cx="515" cy="95" r="2.4" fill="#99c6f4"/>
  <g fill="#f5efe3" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <text x="71.5" y="101">Modbus</text>
    <text x="197.5" y="101">Go collector</text>
    <text x="323.5" y="101">MQTT broker</text>
    <text x="449.5" y="101">Go backend</text>
    <text x="587" y="76">Shopify</text>
    <text x="587" y="125">React UI</text>
  </g>
</svg>
